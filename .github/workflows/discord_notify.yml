name: Discord Notification

on: [push]

jobs:
  discord_notification:
    runs-on: ubuntu-latest
    steps:
      # Step 1: We MUST checkout the code to access the git log properly
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so we can see the commit details

      - name: Send Custom Embed (Python)
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH_NAME: ${{ github.ref_name }}
          TIMESTAMP: ${{ github.event.repository.pushed_at }}
          AUTHOR: ${{ github.actor }} 
        run: |
          import os
          import requests
          import subprocess

          def get_git_info(command):
              return subprocess.check_output(command).decode('utf-8').strip()

          msg = get_git_info(["git", "log", "-1", "--pretty=format:%s"])
          body = get_git_info(["git", "log", "-1", "--pretty=format:%b"])
          files = get_git_info(["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"])

          webhook_url = os.getenv('WEBHOOK_URL')
          repo = os.getenv('REPO_NAME')
          branch = os.getenv('BRANCH_NAME')
          author = os.getenv('AUTHOR')
          
          if not body:
              body = "No se proporcionaron detalles adicionales."
          if not files:
              files = "Sin archivos modificados."

          payload = {
              # AQUÍ ESTÁ EL CAMBIO: Usamos una f-string de Python con la variable 'repo'
              "username": f"ChemaHosting - {repo}",
              "avatar_url": "https://media.discordapp.net/attachments/1396830461594177719/1473288480955170867/resmonlogo2025.png",
              "embeds": [{
                  "title": f"✨ {msg}",
                  "description": f"{body}\n\n📝 **Modificado**\n```\n{files[:1000]}\n```",
                  "color": 15548997,
                  "fields": [
                      {"name": "📦 Script", "value": f"`{repo}`", "inline": True},
                      {"name": "🌿 Rama", "value": f"`{branch}`", "inline": True},
                      {"name": "🙍🏼‍♂️ Autor", "value": f"`{author}`", "inline": True},
                      {"name": "🕒 Fecha", "value": f"<t:{os.getenv('TIMESTAMP', '0')}>", "inline": False},
                  ]
              }]
          }

          requests.post(webhook_url, json=payload)